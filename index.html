<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLDC Sürücü - Hat Bazlı 3D Lehim Kılavuzu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #0d1117; color: #e6edf3; overflow: hidden; width: 100vw; height: 100vh; }
  #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

  /* Üst Kontrol Barı */
  #top-bar {
    position: absolute; top: 8px; left: 8px; right: 8px; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; align-items: center;
    background: rgba(22, 27, 34, 0.88); backdrop-filter: blur(8px);
    padding: 8px 12px; border-radius: 10px; border: 1px solid #30363d;
  }
  .btn-group { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  button {
    background: #21262d; color: #c9d1d9; border: 1px solid #363b42;
    padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  button.active { background: #1f6feb; color: #fff; border-color: #388bfd; }
  button:active { transform: scale(0.97); }
  .slider-wrap { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8b949e; }
  input[type=range] { width: 70px; accent-color: #1f6feb; }

  /* Alt Adım Paneli (Mobil ve Masaüstü Uyumlu) */
  #bottom-panel {
    position: absolute; bottom: 8px; left: 8px; right: 8px; z-index: 10;
    background: rgba(22, 27, 34, 0.92); backdrop-filter: blur(8px);
    border: 1px solid #30363d; border-radius: 12px; padding: 10px 14px;
    max-height: 44vh; display: flex; flex-direction: column; gap: 8px;
  }
  #step-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #step-title { font-size: 14px; font-weight: 700; color: #58a6ff; }
  #step-nav { display: flex; gap: 6px; }
  #step-desc {
    font-size: 12.5px; line-height: 1.45; color: #d0d7de;
    overflow-y: auto; max-height: 24vh; padding-right: 4px;
  }
  #step-desc ul { padding-left: 18px; margin-top: 4px; }
  #step-desc li { margin-bottom: 4px; }
  .hl-part { color: #ffa657; font-weight: 700; }
  .hl-wire { color: #7ee787; font-weight: 700; }

  /* 3D Etiketler */
  .label-3d {
    position: absolute; pointer-events: none; z-index: 5;
    background: rgba(13, 17, 23, 0.85); color: #fff;
    padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.25); white-space: nowrap;
    transform: translate(-50%, -100%);
  }
  .label-3d.active-step {
    background: #1f6feb; border-color: #79c0ff; color: #fff; font-size: 11px;
    box-shadow: 0 0 8px rgba(31,111,235,0.8);
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div id="labels-container"></div>

<div id="top-bar">
  <div class="btn-group">
    <button id="btn-top" onclick="setCameraView('top')">Üstten</button>
    <button id="btn-bottom" onclick="setCameraView('bottom')">Alttan (Lehim)</button>
    <button id="btn-iso" class="active" onclick="setCameraView('iso')">3D Açı</button>
    <button id="btn-labels" class="active" onclick="toggleLabels()">İsimler</button>
  </div>
  <div class="slider-wrap">
    <span>Pertinaks:</span>
    <input type="range" id="board-opacity" min="0" max="0.6" step="0.02" value="0.10" oninput="updateBoardOpacity(this.value)">
  </div>
</div>

<div id="bottom-panel">
  <div id="step-header">
    <div id="step-title">Adım 1 / 8</div>
    <div id="step-nav">
      <button onclick="prevStep()">◀ Önceki</button>
      <button class="active" onclick="nextStep()">Sonraki ▶</button>
      <button onclick="showAllSteps()">Tümünü Gör</button>
    </div>
  </div>
  <div id="step-desc"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 85, 95);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Işıklandırma
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight1.position.set(40, 80, 50);
scene.add(dirLight1);
const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
dirLight2.position.set(-40, -80, -30);
scene.add(dirLight2);

// Pertinaks (Çok Şeffaf)
const boardMat = new THREE.MeshPhongMaterial({
  color: 0xc68b59, transparent: true, opacity: 0.10, depthWrite: false, side: THREE.DoubleSide
});
const boardGeo = new THREE.BoxGeometry(100, 1.6, 100);
const boardMesh = new THREE.Mesh(boardGeo, boardMat);
scene.add(boardMesh);

// İnce Delik Izgarası (Görüntüyü kapatmayan hafif referans noktaları)
const gridHelper = new THREE.GridHelper(96, 38, 0x30363d, 0x21262d);
gridHelper.position.y = 0.82;
scene.add(gridHelper);

// Soğutucular (Yarı Şeffaf Metal)
const hsMat = new THREE.MeshPhongMaterial({ color: 0x8b949e, transparent: true, opacity: 0.28, depthWrite: false });
// 8cm Ana Soğutucu (1-5. MOSFET'ler için)
const hsMain = new THREE.Mesh(new THREE.BoxGeometry(80, 16, 6), hsMat);
hsMain.position.set(-6, 9, -43);
scene.add(hsMain);

// Ayrı Soğutucu (6. MOSFET ve 7812 için)
const hsSub = new THREE.Mesh(new THREE.BoxGeometry(26, 16, 6), hsMat);
hsSub.position.set(36, 9, -22);
scene.add(hsSub);

// Tüm Komponentler ve Kablolar Listesi
const allParts = [];
const allWires = [];
const labelElements = [];
let showLabels = true;

// Yardımcı Fonksiyon: 3D Parça Oluşturma
function addComponent(step, name, type, x, z, rotY = 0) {
  const group = new THREE.Group();
  group.position.set(x, 0.8, z);
  group.rotation.y = rotY;
  group.userData = { step, name };

  const pinMat = new THREE.MeshStandardMaterial({ color: 0xd0d7de, metalness: 0.8, roughness: 0.2 });

  if (type === 'mosfet' || type === '7812') {
    const bodyColor = type === '7812' ? 0x1f6feb : 0x161b22;
    const body = new THREE.Mesh(new THREE.BoxGeometry(9.5, 9, 4.2), new THREE.MeshPhongMaterial({ color: bodyColor }));
    body.position.y = 6.5;
    const tab = new THREE.Mesh(new THREE.BoxGeometry(9.5, 4, 1.2), pinMat);
    tab.position.set(0, 12, -1.5);
    group.add(body, tab);
    [-2.54, 0, 2.54].forEach(px => {
      const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 7, 8), pinMat);
      pin.position.set(px, 0.5, 0);
      group.add(pin);
    });
  } else if (type === 'cap') {
    const body = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 8, 16), new THREE.MeshPhongMaterial({ color: 0x0969da }));
    body.position.y = 4.5;
    // Eksi şeridi (Beyaz)
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.5, 8.1, 1.5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    stripe.position.set(2.2, 4.5, 0);
    group.add(body, stripe);
    [-1.5, 1.5].forEach(px => {
      const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 6, 8), pinMat);
      pin.position.set(px, 0, 0);
      group.add(pin);
    });
  } else if (type === 'ceramic') {
    const body = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 1.2, 12), new THREE.MeshPhongMaterial({ color: 0xd29922 }));
    body.rotation.x = Math.PI / 2;
    body.position.y = 3;
    group.add(body);
    [-1.27, 1.27].forEach(px => {
      const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 5, 8), pinMat);
      pin.position.set(px, 0, 0);
      group.add(pin);
    });
  } else if (type === 'diode') {
    const body = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 7, 12), new THREE.MeshPhongMaterial({ color: 0x21262d }));
    body.rotation.z = Math.PI / 2;
    body.position.y = 2.5;
    // Katot çizgisi
    const band = new THREE.Mesh(new THREE.CylinderGeometry(1.85, 1.85, 1.4, 12), new THREE.MeshBasicMaterial({ color: 0xe6edf3 }));
    band.rotation.z = Math.PI / 2;
    band.position.set(2, 2.5, 0);
    group.add(body, band);
    [-4.5, 4.5].forEach(px => {
      const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 5, 8), pinMat);
      pin.position.set(px, 0.5, 0);
      group.add(pin);
    });
  } else if (type === 'to92_npn' || type === 'to92_pnp') {
    const color = type === 'to92_npn' ? 0x238636 : 0x8957e5;
    const body = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 4.5, 12, 1, false, 0, Math.PI), new THREE.MeshPhongMaterial({ color }));
    body.position.y = 3.5;
    group.add(body);
    [-1.5, 0, 1.5].forEach(px => {
      const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 5.5, 8), pinMat);
      pin.position.set(px, 0, 0);
      group.add(pin);
    });
  } else if (type === 'pc817') {
    const body = new THREE.Mesh(new THREE.BoxGeometry(4.6, 3.2, 6.4), new THREE.MeshPhongMaterial({ color: 0x21262d }));
    body.position.y = 3;
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    dot.position.set(-1.5, 4.7, -2);
    group.add(body, dot);
    [[-1.8, -2], [-1.8, 2], [1.8, 2], [1.8, -2]].forEach(([px, pz]) => {
      const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 5.5, 8), pinMat);
      pin.position.set(px, 0, pz);
      group.add(pin);
    });
  } else if (type === 'resistor') {
    const body = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 5.5, 10), new THREE.MeshPhongMaterial({ color: 0xd2a8ff }));
    body.rotation.z = Math.PI / 2;
    body.position.y = 2;
    group.add(body);
    [-3.5, 3.5].forEach(px => {
      const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 4.5, 8), pinMat);
      pin.position.set(px, 0.2, 0);
      group.add(pin);
    });
  }

  scene.add(group);
  allParts.push(group);

  // Etiket oluştur
  const div = document.createElement('div');
  div.className = 'label-3d';
  div.textContent = name;
  document.getElementById('labels-container').appendChild(div);
  labelElements.push({ div, obj: group, step });
}

// Yardımcı Fonksiyon: Kablo / Lehim Yolu Çizme (Pertinaks Altından)
function addWire(step, points, colorHex, radius = 0.55) {
  const vecs = points.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const curve = new THREE.CatmullRomCurve3(vecs, false, 'catmullrom', 0.05);
  const geo = new THREE.TubeGeometry(curve, vecs.length * 6, radius, 8, false);
  const mat = new THREE.MeshPhongMaterial({ color: colorHex, shininess: 80 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = { step, baseColor: colorHex };

  // Lehim Noktaları (Başlangıç ve Bitiş)
  [vecs[0], vecs[vecs.length - 1]].forEach(v => {
    const pad = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.45, 8, 8), mat);
    pad.position.copy(v);
    mesh.add(pad);
  });

  scene.add(mesh);
  allWires.push(mesh);
}

// ==========================================
// DEVRE ELEMANLARININ HAT BAZLI YERLEŞİMİ
// ==========================================
// Faz X koordinat merkezleri: U = -30, V = -4, W = +22
const phases = [
  { name: 'U', x: -30, stepOut: 4, stepHi: 5, stepLo: 6, mHi: '1. MOSFET', mLo: '2. MOSFET', mLoZ: -38 },
  { name: 'V', x: -4,  stepOut: 7, stepHi: 7, stepLo: 7, mHi: '3. MOSFET', mLo: '4. MOSFET', mLoZ: -38 },
  { name: 'W', x: 22,  stepOut: 8, stepHi: 8, stepLo: 8, mHi: '5. MOSFET', mLo: '6. MOSFET', mLoZ: -17 }
];

// --- ADIM 1: +36V Ana Hattı ve Bu Hatta Değen Tüm Parçalar ---
addComponent(1, '1. MOSFET', 'mosfet', -36, -38);
addComponent(1, '3. MOSFET', 'mosfet', -10, -38);
addComponent(1, '5. MOSFET', 'mosfet', 16, -38);
addComponent(1, '7812 Regülatör', '7812', 41, -17);
// +36V Kalın Kırmızı Bara (1, 3, 5. MOSFET Orta bacakları ve 7812 Sol bacağını tek seferde birleştirir)
addWire(1, [[-45, -1.2, -35], [-36, -1.2, -35], [-10, -1.2, -35], [16, -1.2, -35], [38.46, -1.2, -17]], 0xff2222, 0.95);
// Orta bacaklardan +36V baraya bağlantı
addWire(1, [[-36, -1.2, -38], [-36, -1.2, -35]], 0xff2222, 0.8);
addWire(1, [[-10, -1.2, -38], [-10, -1.2, -35]], 0xff2222, 0.8);
addWire(1, [[16, -1.2, -38], [16, -1.2, -35]], 0xff2222, 0.8);

// --- ADIM 2: GND (Eksi) Ana Hattı ve GND'ye Değen Tüm Parçalar ---
addComponent(2, '2. MOSFET', 'mosfet', -24, -38);
addComponent(2, '4. MOSFET', 'mosfet', 2, -38);
addComponent(2, '6. MOSFET', 'mosfet', 30, -17);
addComponent(2, '47uF (12V)', 'cap', 41, -4);
addComponent(2, '100nF', 'ceramic', 41, 2);

phases.forEach(p => {
  // Alt S8550 (Collector bacağı doğrudan GND hattına lehimlenir)
  addComponent(2, `S8550 (${p.name} Alt)`, 'to92_pnp', p.x + 5, 16);
  // Alt MOSFET Gate-GND 10k direnci (bir bacağı doğrudan GND hattına lehimlenir)
  addComponent(2, '10k', 'resistor', p.x + 5, -8);
});

// Ana GND Kalın Siyah/Gri Bara
addWire(2, [[-45, -1.4, -31], [-21.46, -1.4, -31], [4.54, -1.4, -31], [32.54, -1.4, -17], [41, -1.4, -17], [42.5, -1.4, 2]], 0x6e7681, 0.95);
// Alt MOSFET Sağ (Source) bacakları -> GND
addWire(2, [[-21.46, -1.4, -38], [-21.46, -1.4, -31]], 0x6e7681, 0.8);
addWire(2, [[4.54, -1.4, -38], [4.54, -1.4, -31]], 0x6e7681, 0.8);
// Alt S8550 Collector ve Alt 10k dirençlerin GND birleşimi
addWire(2, [[-21.5, -1.4, 16], [30.5, -1.4, 16], [42.5, -1.4, 2]], 0x6e7681, 0.6);
phases.forEach(p => {
  addWire(2, [[p.x + 8.5, -1.4, -8], [p.x + 8.5, -1.4, 16]], 0x6e7681, 0.5);
});

// --- ADIM 3: +12V Hattı ve Bu Hatta Değen Tüm Parçalar ---
phases.forEach(p => {
  // SB5B0 Diyotlar (Anot bacakları doğrudan +12V hattına lehimlenir)
  addComponent(3, 'SB5B0 Diyot', 'diode', p.x - 4, -2);
  // Alt S8050 (Collector bacakları doğrudan +12V hattına lehimlenir)
  addComponent(3, `S8050 (${p.name} Alt)`, 'to92_npn', p.x + 5, 9);
});
// +12V Turuncu Hat (7812 Sağ bacak -> 47uF(+) -> 100nF -> 3x SB5B0 Anot -> 3x S8050 Collector)
addWire(3, [[43.54, -1.2, -17], [39.5, -1.2, -4], [39.5, -1.2, 2], [13.5, -1.2, -2], [-12.5, -1.2, -2], [-38.5, -1.2, -2]], 0xff9800, 0.65);
addWire(3, [[-38.5, -1.2, -2], [-26.5, -1.2, 9], [-0.5, -1.2, 9], [25.5, -1.2, 9]], 0xff9800, 0.55);

// --- ADIM 4, 5, 6, 7, 8: Faz Çıkışları ve Sürücü Grupları ---
phases.forEach(p => {
  const mHiX = p.name === 'U' ? -36 : (p.name === 'V' ? -10 : 16);
  const mLoX = p.name === 'U' ? -24 : (p.name === 'V' ? 2 : 30);

  // 1) Ortak Faz Çıkış Hattı ve Bu Hatta Değen Parçalar
  addComponent(p.stepOut, '47uF', 'cap', p.x - 4, -12);
  addComponent(p.stepOut, `S8550 (${p.name} Üst)`, 'to92_pnp', p.x - 4, 16);
  addComponent(p.stepOut, '10k', 'resistor', p.x - 4, -22); // Üst Gate-Source 10k
  addComponent(p.stepOut, '10k', 'resistor', p.x - 4, 24);  // PC817 çıkış 10k

  // Kalın Faz Çıkış Kablosu (Üst MOSFET Sağ Bacak + Alt MOSFET Orta Bacak + 47uF(-) + Üst S8550 Collector + 2x 10k Direnç)
  addWire(p.stepOut, [
    [mHiX + 2.54, -1.3, -38],
    [mLoX, -1.3, p.mLoZ],
    [p.x - 2.5, -1.3, -22],
    [p.x - 2.5, -1.3, -12],
    [p.x - 2.5, -1.3, 16],
    [p.x - 0.5, -1.3, 24]
  ], 0x3fb950, 0.8);

  // 2) Üst Sürücü Parçaları ve Bağlantıları
  addComponent(p.stepHi, `S8050 (${p.name} Üst)`, 'to92_npn', p.x - 4, 9);
  addComponent(p.stepHi, 'PC817', 'pc817', p.x - 4, 32);
  addComponent(p.stepHi, '22 Ohm', 'resistor', p.x - 4, -27);
  addComponent(p.stepHi, '330 Ohm', 'resistor', p.x - 4, 41);

  // Bootstrap (+) Düğümü: SB5B0 Katot + 47uF(+) + S8050 Collector + PC817 Pin 4
  addWire(p.stepHi, [
    [p.x + 0.5, -1.1, -2],
    [p.x - 5.5, -1.1, -12],
    [p.x - 5.5, -1.1, 9],
    [p.x - 2.2, -1.1, 30]
  ], 0xd2a8ff, 0.55);

  // PC817 Pin 3 -> Üst S8050/S8550 Base (Orta) + 10k Direnç
  addWire(p.stepHi, [
    [p.x - 2.2, -1.1, 34],
    [p.x - 7.5, -1.1, 24],
    [p.x - 4, -1.1, 16],
    [p.x - 4, -1.1, 9]
  ], 0x58a6ff, 0.5);

  // Üst S8050/S8550 Emitter -> 22 Ohm -> Üst MOSFET Gate (Sol Bacak) + 10k Direnç
  addWire(p.stepHi, [
    [p.x - 5.5, -1.1, 16],
    [p.x - 5.5, -1.1, 9],
    [p.x - 7.5, -1.1, -27]
  ], 0x79c0ff, 0.5);
  addWire(p.stepHi, [
    [p.x - 0.5, -1.1, -27],
    [p.x - 7.5, -1.1, -22],
    [mHiX - 2.54, -1.1, -38]
  ], 0x79c0ff, 0.55);

  // 330 Ohm -> PC817 Pin 1 (Üst PWM Girişi)
  addWire(p.stepHi, [[p.x - 7.5, -1.1, 41], [p.x - 5.8, -1.1, 30]], 0xffa657, 0.45);

  // 3) Alt Sürücü Parçaları ve Bağlantıları
  addComponent(p.stepLo, '22 Ohm', 'resistor', p.x + 5, -14);
  addComponent(p.stepLo, '1k', 'resistor', p.x + 5, 28);

  // Alt S8050/S8550 Base (Orta) -> 1k Direnç (Alt PWM Girişi)
  addWire(p.stepLo, [
    [p.x + 5, -1.1, 9],
    [p.x + 5, -1.1, 16],
    [p.x + 1.5, -1.1, 28]
  ], 0x58a6ff, 0.5);

  // Alt S8050/S8550 Emitter -> 22 Ohm -> Alt MOSFET Gate (Sol Bacak) + 10k Direnç
  addWire(p.stepLo, [
    [p.x + 6.5, -1.1, 9],
    [p.x + 6.5, -1.1, 16],
    [p.x + 1.5, -1.1, -14]
  ], 0x79c0ff, 0.5);
  addWire(p.stepLo, [
    [p.x + 8.5, -1.1, -14],
    [p.x + 1.5, -1.1, -8],
    [mLoX - 2.54, -1.1, p.mLoZ]
  ], 0x79c0ff, 0.55);
});

// ==========================================
// ADIM AÇIKLAMALARI (HAT BAZLI BİRLİKTE LEHİMLEME)
// ==========================================
const stepData = [
  {
    title: "Adım 1 / 8: +36V Ana Güç Hattı ve Bu Hatta Değen Parçalar",
    desc: `Sonradan kalın kabloya ek yapmamak için, bacağı <b>+36V Ana Hattına</b> değecek olan tüm parçaları yerleştirip tek seferde lehimliyoruz:
    <ul>
      <li><span class="hl-part">1, 3 ve 5. MOSFET (IRF2807):</span> 8 cm soğutucuya Kapton bantla yalıtarak sabitleyin.</li>
      <li><span class="hl-part">7812 Regülatör:</span> Ayrı soğutucuya sabitleyin.</li>
      <li><span class="hl-wire">Kırmızı +36V Kablosu:</span> <b>1, 3 ve 5. MOSFET'in Orta (Drain) bacaklarını</b> ve <b>7812'nin Sol (Giriş) bacağını</b> aynı kalın kalaylı kabloyla tek seferde birbirine lehimleyin.</li>
    </ul>`
  },
  {

let currentStep = 1;
let viewAll = false;

function updateStepVisibility() {
  document.getElementById('step-title').textContent = viewAll
    ? "Tüm Devre Görünümü (Adım 1 - 8)"
    : stepData[currentStep - 1].title;
  document.getElementById('step-desc').innerHTML = stepData[currentStep - 1].desc;

  allParts.forEach(part => {
    const s = part.userData.step;
    part.visible = viewAll || s <= currentStep;
    part.traverse(child => {
      if (child.isMesh && child.material) {
        child.material.transparent = (!viewAll && s < currentStep);
        child.material.opacity = (!viewAll && s < currentStep) ? 0.32 : 1.0;
      }
    });
  });

  allWires.forEach(wire => {
    const s = wire.userData.step;
    wire.visible = viewAll || s <= currentStep;
    wire.material.transparent = (!viewAll && s < currentStep);
    wire.material.opacity = (!viewAll && s < currentStep) ? 0.25 : 1.0;
    wire.material.emissive = new THREE.Color((!viewAll && s === currentStep) ? wire.userData.baseColor : 0x000000);
    wire.material.emissiveIntensity = (!viewAll && s === currentStep) ? 0.45 : 0;
  });
}

function nextStep() {
  viewAll = false;
  if (currentStep < stepData.length) currentStep++;
  updateStepVisibility();
}

function prevStep() {
  viewAll = false;
  if (currentStep > 1) currentStep--;
  updateStepVisibility();
}

function showAllSteps() {
  viewAll = !viewAll;
  updateStepVisibility();
}

function updateBoardOpacity(val) {
  boardMat.opacity = parseFloat(val);
}

function toggleLabels() {
  showLabels = !showLabels;
  document.getElementById('btn-labels').classList.toggle('active', showLabels);
}

function setCameraView(mode) {
  document.querySelectorAll('#top-bar .btn-group button').forEach(b => {
    if (b.id !== 'btn-labels') b.classList.remove('active');
  });
  if (mode === 'top') {
    camera.position.set(0, 120, 0.1);
    document.getElementById('btn-top').classList.add('active');
  } else if (mode === 'bottom') {
    camera.position.set(0, -120, 0.1);
    document.getElementById('btn-bottom').classList.add('active');
  } else {
    camera.position.set(0, 85, 95);
    document.getElementById('btn-iso').classList.add('active');
  }
  controls.target.set(0, 0, 0);
  controls.update();
}

function updateLabels() {
  const halfW = window.innerWidth / 2;
  const halfH = window.innerHeight / 2;

  labelElements.forEach(item => {
    const isStepVisible = viewAll || item.step <= currentStep;
    if (!showLabels || !isStepVisible) {
      item.div.style.display = 'none';
      return;
    }
    // Önceki adımların etiketlerini gizle veya sönükleştir ki kalabalık yapmasın
    if (!viewAll && item.step < currentStep) {
      item.div.style.opacity = '0.35';
      item.div.classList.remove('active-step');
    } else {
      item.div.style.opacity = '1';
      item.div.classList.toggle('active-step', !viewAll && item.step === currentStep);
    }

    const pos = new THREE.Vector3();
    item.obj.getWorldPosition(pos);
    pos.y += 7;
    pos.project(camera);

    if (pos.z > 1) {
      item.div.style.display = 'none';
    } else {
      item.div.style.display = 'block';
      item.div.style.left = (pos.x * halfW + halfW) + 'px';
      item.div.style.top = (-pos.y * halfH + halfH) + 'px';
    }
  });
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

updateStepVisibility();

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateLabels();
  renderer.render(scene, camera);
}
animate();
</script>
