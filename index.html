<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLDC Sürücü 3D Montaj Kılavuzu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0b0f17; color: #e2e8f0; overflow: hidden; width: 100vw; height: 100vh; touch-action: none; }
  #canvas-container { width: 100vw; height: 100vh; position: absolute; inset: 0; z-index: 1; }

  /* Kompakt Üst Menü (Mobil Uyumlu Tek Satır) */
  #top-bar {
    position: absolute; top: 6px; left: 6px; right: 6px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px);
    padding: 5px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
    overflow-x: auto;
  }
  .btn-row { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  button {
    background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
    padding: 5px 8px; border-radius: 6px; font-size: 11px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  button.active { background: #2563eb; color: #ffffff; border-color: #60a5fa; }
  .opacity-ctrl { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #94a3b8; flex-shrink: 0; }
  .opacity-ctrl input { width: 55px; height: 18px; accent-color: #3b82f6; }

  /* Kompakt Alt Adım Kartı (Gizlenebilir/Küçültülebilir) */
  #bottom-card {
    position: absolute; bottom: 6px; left: 6px; right: 6px; z-index: 10;
    background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 10px;
    padding: 8px 10px; transition: max-height 0.2s ease;
  }
  #card-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  #step-title { font-size: 12px; font-weight: 700; color: #60a5fa; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-btns { display: flex; gap: 4px; align-items: center; }
  #step-body {
    margin-top: 6px; font-size: 11.5px; line-height: 1.38; color: #e2e8f0;
    max-height: 18vh; overflow-y: auto; padding-right: 2px;
  }
  #bottom-card.minimized #step-body { display: none; }
  .p-tag { color: #fbbf24; font-weight: 700; }
  .w-tag { color: #34d399; font-weight: 700; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="top-bar">
  <div class="btn-row">
    <button id="v-iso" class="active" onclick="setView('iso')">3D</button>
    <button id="v-top" onclick="setView('top')">Üst</button>
    <button id="v-bot" onclick="setView('bot')">Alt (Lehim)</button>
    <button id="btn-lbl" class="active" onclick="cycleLabelMode()">İsim: Aktif Adım</button>
  </div>
  <div class="opacity-ctrl">
    <span>Plaket:</span>
    <input type="range" min="0" max="0.5" step="0.02" value="0.08" oninput="setBoardOpacity(this.value)">
  </div>
</div>

<div id="bottom-card">
  <div id="card-head">
    <div id="step-title">Adım 1/7</div>
    <div class="nav-btns">
      <button onclick="changeStep(-1)">◀</button>
      <button class="active" onclick="changeStep(1)">İleri ▶</button>
      <button id="btn-all" onclick="toggleAll()">Tümü</button>
      <button id="btn-min" onclick="toggleMin()">▼</button>
    </div>
  </div>
  <div id="step-body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f17);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 600);
camera.position.set(0, 78, 82);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 2);

// Işıklar
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const dLight1 = new THREE.DirectionalLight(0xffffff, 0.7);
dLight1.position.set(50, 90, 60);
scene.add(dLight1);
const dLight2 = new THREE.DirectionalLight(0x93c5fd, 0.4);
dLight2.position.set(-50, -80, -40);
scene.add(dLight2);

// Ultra Şeffaf Pertinaks Plaket
const boardMat = new THREE.MeshPhongMaterial({
  color: 0xd97706, transparent: true, opacity: 0.08, depthWrite: false, side: THREE.DoubleSide
});
const board = new THREE.Mesh(new THREE.BoxGeometry(96, 1.4, 88), boardMat);
scene.add(board);

// İnce Delik Referans Izgarası
const grid = new THREE.GridHelper(92, 36, 0x334155, 0x1e293b);
grid.position.y = 0.72;
grid.scale.z = 84 / 92;
scene.add(grid);

// Soğutucular (Yarı Şeffaf)
const hsMat = new THREE.MeshPhongMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.22, depthWrite: false });
// 8cm Ana Soğutucu (Q1-Q5)
const hs1 = new THREE.Mesh(new THREE.BoxGeometry(74, 15, 4), hsMat);
hs1.position.set(-7, 8.2, -37.5);
scene.add(hs1);
// Ayrı Soğutucu (Q6 ve 7812)
const hs2 = new THREE.Mesh(new THREE.BoxGeometry(26, 15, 4), hsMat);
hs2.position.set(33, 8.2, -22.5);
scene.add(hs2);

const parts = [];
const wires = [];
const sprites = [];

// 3D Ölçekli Etiket (Ekranı kaplamaz, yakınlaşınca okunur)
function makeTextSprite(text, bgColor = 'rgba(15,23,42,0.88)', borderColor = '#60a5fa') {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 26px sans-serif';
  const w = Math.ceil(ctx.measureText(text).width) + 24;
  const h = 40;
  canvas.width = w;
  canvas.height = h;

  ctx.fillStyle = bgColor;
  ctx.strokeStyle = borderColor;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(2, 2, w - 4, h - 4, 8);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, w / 2, h / 2 + 1);

  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(w * 0.065, h * 0.065, 1);
  return sprite;
}

const leadMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.85, roughness: 0.2 });

// Parça Oluşturucu (Bacak koordinatları net)
function createPart(step, label, type, x, z, opts = {}) {
  const g = new THREE.Group();
  g.position.set(x, 0.7, z);
  g.userData = { step, label };

  let labelY = 6.5;

  if (type === 'to220') {
    const isReg = opts.isReg || false;
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(9.2, 8.5, 4),
      new THREE.MeshPhongMaterial({ color: isReg ? 0x1d4ed8 : 0x1e293b })
    );
    body.position.y = 6.2;
    const tab = new THREE.Mesh(new THREE.BoxGeometry(9.2, 3.8, 1.1), leadMat);
    tab.position.set(0, 11.5, -1.45);
    // Kapton Bant Gösterimi (Kehribar rengi yalıtım)
    const kapton = new THREE.Mesh(
      new THREE.BoxGeometry(10.2, 13, 0.4),
      new THREE.MeshBasicMaterial({ color: 0xd97706, transparent: true, opacity: 0.65 })
    );
    kapton.position.set(0, 7.5, -2.2);
    g.add(body, tab, kapton);

    [-2.54, 0, 2.54].forEach(px => {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 6.5, 8), leadMat);
      p.position.set(px, 0.2, 0);
      g.add(p);
    });
    labelY = 14.5;
  }
  else if (type === 'elcap') {
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(3.2, 3.2, 7.5, 16),
      new THREE.MeshPhongMaterial({ color: 0x0284c7 })
    );
    body.position.y = 4.2;
    // Eksi (-) şeridi sağ bacakta (+1.5)
    const neg = new THREE.Mesh(new THREE.BoxGeometry(1.4, 7.6, 1.8), new THREE.MeshBasicMaterial({ color: 0xf8fafc }));
    neg.position.set(2.2, 4.2, 0);
    g.add(body, neg);
    [-1.5, 1.5].forEach(px => {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 5.5, 8), leadMat);
      p.position.set(px, -0.2, 0);
      g.add(p);
    });
    labelY = 9.5;
  }
  else if (type === 'ceramic') {
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(2.2, 2.2, 1.2, 12),
      new THREE.MeshPhongMaterial({ color: 0xd97706 })
    );
    body.rotation.x = Math.PI / 2;
    body.position.y = 3.2;
    g.add(body);
    [-1.5, 1.5].forEach(px => {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 5, 8), leadMat);
      p.position.set(px, -0.2, 0);
      g.add(p);
    });
    labelY = 6.8;
  }
  else if (type === 'diode') {
    // Dikey veya yatay yerleşim: Anot (-z / üst), Katot (+z / alt çizgili)
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(1.9, 1.9, 6.5, 12),
      new THREE.MeshPhongMaterial({ color: 0x0f172a })
    );
    body.rotation.x = Math.PI / 2;
    body.position.y = 2.6;
    const band = new THREE.Mesh(
      new THREE.CylinderGeometry(1.96, 1.96, 1.4, 12),
      new THREE.MeshBasicMaterial({ color: 0xe2e8f0 })
    );
    band.rotation.x = Math.PI / 2;
    band.position.set(0, 2.6, 1.8); // Katot (+z tarafı)
    g.add(body, band);
    [-4, 4].forEach(pz => {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 5, 8), leadMat);
      p.position.set(0, 0, pz);
      g.add(p);
    });
    labelY = 6.2;
  }
  else if (type === 'to92') {
    const isPnp = opts.isPnp || false;
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(2.2, 2.2, 4.2, 12, 1, false, 0, Math.PI),
      new THREE.MeshPhongMaterial({ color: isPnp ? 0x9333ea : 0x16a34a })
    );
    body.position.y = 3.2;
    g.add(body);
    // Sol(-1.5): Emitter, Orta(0): Base, Sağ(+1.5): Collector
    [-1.5, 0, 1.5].forEach(px => {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 5.2, 8), leadMat);
      p.position.set(px, -0.2, 0);
      g.add(p);
    });
    labelY = 6.8;
  }
  else if (type === 'pc817') {
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(4.6, 3.2, 6.2),
      new THREE.MeshPhongMaterial({ color: 0x1e293b })
    );
    body.position.y = 2.8;
    // Pin 1 Noktası (Sol-Alt: -1.8, +2.0)
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.45, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfef08a }));
    dot.position.set(-1.4, 4.5, 2.0);
    g.add(body, dot);
    // Pin1:(-1.8,+2), Pin2:(+1.8,+2), Pin3:(+1.8,-2), Pin4:(-1.8,-2)
    [[-1.8, 2], [1.8, 2], [1.8, -2], [-1.8, -2]].forEach(([px, pz]) => {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 5.2, 8), leadMat);
      p.position.set(px, -0.2, pz);
      g.add(p);
    });
    labelY = 6.8;
  }
  else if (type === 'res') {
    // opts.dir === 'z' ise kuzey-güney (-3..+3 z), yoksa doğu-batı (-3..+3 x)
    const alongZ = opts.dir === 'z';
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(1.05, 1.05, 4.4, 10),
      new THREE.MeshPhongMaterial({ color: 0xfde68a })
    );
    if (alongZ) body.rotation.x = Math.PI / 2;
    else body.rotation.z = Math.PI / 2;
    body.position.y = 2.0;
    g.add(body);
    [-3, 3].forEach(d => {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 4.6, 8), leadMat);
      p.position.set(alongZ ? 0 : d, -0.2, alongZ ? d : 0);
      g.add(p);
    });
    labelY = 4.8;
  }

  const sp = makeTextSprite(label);
  sp.position.set(0, labelY, 0);
  g.add(sp);
  sprites.push({ sprite: sp, step });

  scene.add(g);
  parts.push(g);
}

// Lehim Yolu Oluşturucu (Pertinaks Altı: y = -1.1)
function createWire(step, pts, colorHex, radius = 0.52) {
  const vPts = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const curve = new THREE.CatmullRomCurve3(vPts, false, 'catmullrom', 0.02);
  const geo = new THREE.TubeGeometry(curve, Math.max(vPts.length * 6, 12), radius, 8, false);
  const mat = new THREE.MeshPhongMaterial({ color: colorHex, shininess: 90 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = { step, colorHex };

  // Her bacak düğümüne lehim topu ekle
  vPts.forEach(v => {
    const joint = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.35, 8, 8), mat);
    joint.position.copy(v);
    mesh.add(joint);
  });

  scene.add(mesh);
  wires.push(mesh);
}

// =========================================================
// TAM HİZALI DEVRE YERLEŞİMİ (HER PARÇA BACAK BACAĞA EŞLEŞİR)
// =========================================================
// Faz Merkezleri: U = -30, V = -4, W = +22
const phList = [
  { name: 'U', cx: -30, qHiX: -36, qLoX: -24, qLoZ: -35, qHiName: 'Q1 IRF2807', qLoName: 'Q2 IRF2807' },
  { name: 'V', cx: -4,  qHiX: -10, qLoX: 2,   qLoZ: -35, qHiName: 'Q3 IRF2807', qLoName: 'Q4 IRF2807' },
  { name: 'W', cx: 22,  qHiX: 16,  qLoX: 28,  qLoZ: -20, qHiName: 'Q5 IRF2807', qLoName: 'Q6 IRF2807' }
];

// --- ADIM 1: Soğutucudaki MOSFET'ler, 7812 ve +36V Ana Hattı ---
phList.forEach(p => {
  createPart(1, p.qHiName, 'to220', p.qHiX, -35);
  createPart(1, p.qLoName, 'to220', p.qLoX, p.qLoZ);
});
createPart(1, '7812', 'to220', 40, -20, { isReg: true });

// +36V Kırmızı Ana Bara: Q1 Orta(-36,-35) -> Q3 Orta(-10,-35) -> Q5 Orta(16,-35) -> 7812 Sol(37.46,-20)
createWire(1, [
  [-44, -1.2, -32],
  [-36, -1.2, -32],
  [-10, -1.2, -32],
  [16, -1.2, -32],
  [37.46, -1.2, -20]
], 0xef4444, 0.9);
// Q1, Q3, Q5 Orta bacaklarını +36V hattına bağla
[ -36, -10, 16 ].forEach(x => createWire(1, [[x, -1.2, -35], [x, -1.2, -32]], 0xef4444, 0.8));

// --- ADIM 2: GND (Eksi) Ana Hattı ve GND'ye Değen Tüm Parçalar ---
// 7812 çıkış filtre kondansatörleri (Eksi bacakları x=41.5'te GND'ye değer)
createPart(2, '47uF', 'elcap', 40, -10);
createPart(2, '100nF', 'ceramic', 40, -4);

phList.forEach(p => {
  // Alt MOSFET Gate-GND 10k direnci (Sol:-26.54 Gate, Sağ:-20.54 GND)
  createPart(2, '10k', 'res', p.qLoX - 0.54, p.qLoZ + 6);
  // Alt S8550 (Sol:E, Orta:B, Sağ:Collector=GND -> p.cx + 5.5)
  createPart(2, 'S8550', 'to92', p.cx + 4, 15, { isPnp: true });
  // PC817 Optokuplör (Pin 2 Katot = GND -> p.cx - 2.2, z=30)
  createPart(2, 'PC817', 'pc817', p.cx - 4, 28);
});

// GND Ana Siyah/Gri Bara (Q2 Sağ -> Q4 Sağ -> Q6 Sağ -> 7812 Orta -> 47uF(-) -> 100nF(-))
createWire(2, [
  [-44, -1.4, -29],
  [-21.46, -1.4, -29],
  [4.54, -1.4, -29],
  [30.54, -1.4, -20],
  [40, -1.4, -20],
  [41.5, -1.4, -10],
  [41.5, -1.4, -4]
], 0x64748b, 0.9);

// Q2 ve Q4 Sağ (Source) bacakları ve 10k dirençlerin sağ bacaklarını GND'ye bağla
createWire(2, [[-21.46, -1.4, -35], [-21.46, -1.4, -29], [-21.54, -1.4, -29]], 0x64748b, 0.7);
createWire(2, [[4.54, -1.4, -35], [4.54, -1.4, -29], [4.46, -1.4, -29]], 0x64748b, 0.7);
createWire(2, [[30.54, -1.4, -20], [30.46, -1.4, -14]], 0x64748b, 0.65);

// Alt S8550 Collector (p.cx+5.5, 15) ve PC817 Pin 2 (p.cx-2.2, 30) GND ortak hattı
createWire(2, [
  [41.5, -1.4, -4],
  [41.5, -1.4, 15],
  [27.5, -1.4, 15],
  [1.5, -1.4, 15],
  [-24.5, -1.4, 15]
], 0x64748b, 0.6);

phList.forEach(p => {
  // Alt 10k sağ bacak -> Alt S8550 Collector -> PC817 Pin 2
  createWire(2, [
    [p.qLoX + 2.46, -1.4, p.qLoZ + 6],
    [p.cx + 5.5, -1.4, 15],
    [p.cx - 2.2, -1.4, 30]
  ], 0x64748b, 0.5);
});

// --- ADIM 3: +12V Besleme Hattı ve +12V'a Değen Tüm Parçalar ---
phList.forEach(p => {
  // SB5B0 Diyot (Anot: z=-6 [+12V], Katot çizgili: z=+2 [Bootstrap])
  createPart(3, 'SB5B0', 'diode', p.cx - 4, -2);
  // Alt S8050 (Sol:E, Orta:B, Sağ:Collector = +12V -> p.cx + 5.5, z=8)
  createPart(3, 'S8050', 'to92', p.cx + 4, 8);
});

// +12V Turuncu Hat: 7812 Sağ(42.54,-20) -> 47uF(+)(38.5,-10) -> 100nF(+)(38.5,-4) -> 3x SB5B0 Anot(z=-6) -> 3x Alt S8050 C(z=8)
createWire(3, [
  [42.54, -1.2, -20],
  [38.5, -1.2, -10],
  [38.5, -1.2, -4],
  [18, -1.2, -6],
  [-8, -1.2, -6],
  [-34, -1.2, -6]
], 0xf97316, 0.65);

phList.forEach(p => {
  createWire(3, [[p.cx - 4, -1.2, -6], [p.cx + 5.5, -1.2, 8]], 0xf97316, 0.5);
});

// --- ADIM 4: U, V, W Faz Çıkış Hatları ve Bu Hatta Değen Tüm Parçalar ---
phList.forEach(p => {
  // Üst MOSFET Gate-Source 10k direnci (Sol: Gate, Sağ: Source/Faz)
  createPart(4, '10k', 'res', p.qHiX - 0.54, -25);
  // Bootstrap 47uF Kondansatör (Sol: +, Sağ: Eksi/Faz)
  createPart(4, '47uF', 'elcap', p.cx - 4, -12);
  // Üst S8550 (Sağ bacak Collector = Faz)
  createPart(4, 'S8550', 'to92', p.cx - 4, 15, { isPnp: true });
  // PC817 Çıkış 10k Direnci (Sol: Base/PC817_Pin3, Sağ: Faz)
  createPart(4, '10k', 'res', p.cx - 4, 21);

  // Yeşil Kalın Faz Hattı: Üst MOSFET Sağ(Source) + Alt MOSFET Orta(Drain) + 10k(Sağ) + 47uF(-) + Üst S8550(C) + 10k(Sağ)
  createWire(4, [
    [p.qHiX + 2.54, -1.3, -35],
    [p.qLoX, -1.3, p.qLoZ],
    [p.qHiX + 2.46, -1.3, -25],
    [p.cx - 2.5, -1.3, -12],
    [p.cx - 2.5, -1.3, 15],
    [p.cx - 1.0, -1.3, 21]
  ], 0x10b981, 0.8);
});

// --- ADIM 5: Bootstrap (+) Hattı (SB5B0 Katot + 47uF(+) + Üst S8050 + PC817 Pin 4) ---
phList.forEach(p => {
  // Üst S8050 (Sağ bacak Collector = Bootstrap +)
  createPart(5, 'S8050', 'to92', p.cx - 4, 8);

  // Mor Bootstrap Hattı: SB5B0 Çizgili Katot(z=+2) + 47uF(+)(p.cx-5.5, -12) + Üst S8050 C(p.cx-2.5, 8) + PC817 Pin 4(p.cx-5.8, 26)
  createWire(5, [
    [p.cx - 5.5, -1.1, -12],
    [p.cx - 4, -1.1, 2],
    [p.cx - 2.5, -1.1, 8],
    [p.cx - 5.8, -1.1, 26]
  ], 0xc084fc, 0.55);
});

// --- ADIM 6: 22 Ohm Gate Dirençleri ve MOSFET Gate (Sol Bacak) Bağlantıları ---
phList.forEach(p => {
  // Üst 22 Ohm direnç (z yönünde: Kuzey ucu Gate'e, Güney ucu Üst S8050/S8550 Emitter'e)
  createPart(6, '22 Ohm', 'res', p.cx - 6.5, -19, { dir: 'z' });
  // Alt 22 Ohm direnç (z yönünde: Kuzey ucu Alt Gate'e, Güney ucu Alt S8050/S8550 Emitter'e)
  createPart(6, '22 Ohm', 'res', p.cx + 2.5, -1, { dir: 'z' });

  // Üst S8050/S8550 Emitter (Sol bacaklar: p.cx-5.5) -> Üst 22 Ohm Güney ucu(-16)
  createWire(6, [
    [p.cx - 5.5, -1.1, 15],
    [p.cx - 5.5, -1.1, 8],
    [p.cx - 6.5, -1.1, -16]
  ], 0x38bdf8, 0.5);

  // Üst 22 Ohm Kuzey ucu(-22) -> Üst 10k Sol bacak -> Üst MOSFET Gate (Sol bacak)
  createWire(6, [
    [p.cx - 6.5, -1.1, -22],
    [p.qHiX - 3.54, -1.1, -25],
    [p.qHiX - 2.54, -1.1, -35]
  ], 0x38bdf8, 0.55);

  // Alt S8050/S8550 Emitter (Sol bacaklar: p.cx+2.5) -> Alt 22 Ohm Güney ucu(+2)
  createWire(6, [
    [p.cx + 2.5, -1.1, 15],
    [p.cx + 2.5, -1.1, 8],
    [p.cx + 2.5, -1.1, 2]
  ], 0x38bdf8, 0.5);

  // Alt 22 Ohm Kuzey ucu(-4) -> Alt 10k Sol bacak -> Alt MOSFET Gate (Sol bacak)
  createWire(6, [
    [p.cx + 2.5, -1.1, -4],
    [p.qLoX - 3.54, -1.1, p.qLoZ + 6],
    [p.qLoX - 2.54, -1.1, p.qLoZ]
  ], 0x38bdf8, 0.55);
});

// --- ADIM 7: S8050/S8550 Base (Orta Bacaklar) ve PWM Giriş Dirençleri (330 Ohm ve 1k) ---
phList.forEach(p => {
  // Üst PWM Giriş Direnci: 330 Ohm (PC817 Pin 1'e bağlanır)
  createPart(7, '330 Ohm', 'res', p.cx - 5.8, 35, { dir: 'z' });
  // Alt PWM Giriş Direnci: 1k (Alt S8050/S8550 Base bacaklarına bağlanır)
  createPart(7, '1k', 'res', p.cx + 4, 25, { dir: 'z' });

  // Üst Base Hattı: PC817 Pin 3 (p.cx-2.2, 26) -> 10k Sol Bacak (p.cx-7, 21) -> Üst S8550 Orta(15) -> Üst S8050 Orta(8)
  createWire(7, [
    [p.cx - 2.2, -1.1, 26],
    [p.cx - 7.0, -1.1, 21],
    [p.cx - 4.0, -1.1, 15],
    [p.cx - 4.0, -1.1, 8]
  ], 0xfacc15, 0.5);

  // 330 Ohm Kuzey ucu(32) -> PC817 Pin 1 (p.cx-5.8, 30)
  createWire(7, [[p.cx - 5.8, -1.1, 32], [p.cx - 5.8, -1.1, 30]], 0xfacc15, 0.5);

  // Alt Base Hattı: 1k Kuzey ucu(22) -> Alt S8550 Orta(15) -> Alt S8050 Orta(8)
  createWire(7, [
    [p.cx + 4.0, -1.1, 22],
    [p.cx + 4.0, -1.1, 15],
    [p.cx + 4.0, -1.1, 8]
  ], 0xfacc15, 0.5);
});

let curStep = 1;
let showAll = false;
let labelMode = 1; // 1: Sadece Aktif Adım, 2: Tüm İsimler, 0: Gizli

function refreshScene() {
  document.getElementById('step-title').textContent = showAll
    ? "Tüm Devre (Adım 1-7)"
    : steps[curStep - 1].title;
  document.getElementById('step-body').innerHTML = steps[curStep - 1].body;
  document.getElementById('btn-all').classList.toggle('active', showAll);

  parts.forEach(p => {
    const s = p.userData.step;
    p.visible = showAll || s <= curStep;
    const isPast = !showAll && s < curStep;
    p.traverse(c => {
      if (c.isMesh && c.material) {
        c.material.transparent = isPast || c.material.opacity < 1;
        c.material.opacity = isPast ? 0.28 : (c.material.opacity === 0.65 ? 0.65 : 1.0);
      }
    });
  });

  wires.forEach(w => {
    const s = w.userData.step;
    w.visible = showAll || s <= curStep;
    const isCur = !showAll && s === curStep;
    const isPast = !showAll && s < curStep;
    w.material.transparent = isPast;
    w.material.opacity = isPast ? 0.22 : 1.0;
    w.material.emissive = new THREE.Color(isCur ? w.userData.colorHex : 0x000000);
    w.material.emissiveIntensity = isCur ? 0.5 : 0;
  });

  sprites.forEach(item => {
    if (labelMode === 0) {
      item.sprite.visible = false;
    } else if (labelMode === 1) {
      item.sprite.visible = showAll || item.step === curStep;
    } else {
      item.sprite.visible = showAll || item.step <= curStep;
    }
  });
}

function changeStep(dir) {
  showAll = false;
  curStep = Math.max(1, Math.min(steps.length, curStep + dir));
  refreshScene();
}

function toggleAll() {
  showAll = !showAll;
  refreshScene();
}

function toggleMin() {
  const card = document.getElementById('bottom-card');
  const btn = document.getElementById('btn-min');
  card.classList.toggle('minimized');
  btn.textContent = card.classList.contains('minimized') ? '▲' : '▼';
}

function cycleLabelMode() {
  labelMode = (labelMode + 1) % 3;
  const btn = document.getElementById('btn-lbl');
  const names = ['İsim: Kapalı', 'İsim: Aktif Adım', 'İsim: Tümü'];
  btn.textContent = names[labelMode];
  btn.classList.toggle('active', labelMode > 0);
  refreshScene();
}

function setBoardOpacity(val) {
  boardMat.opacity = parseFloat(val);
}

function setView(v) {
  ['v-iso', 'v-top', 'v-bot'].forEach(id => document.getElementById(id).classList.remove('active'));
  if (v === 'top') {
    camera.position.set(0, 115, 0.1);
    document.getElementById('v-top').classList.add('active');
  } else if (v === 'bot') {
    camera.position.set(0, -115, 0.1);
    document.getElementById('v-bot').classList.add('active');
  } else {
    camera.position.set(0, 78, 82);
    document.getElementById('v-iso').classList.add('active');
  }
  controls.target.set(0, 0, 2);
  controls.update();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

refreshScene();

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
